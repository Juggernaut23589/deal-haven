[defaults]
inventory = inventory/hosts.yml
remote_user = ubuntu
private_key_file = ~/.ssh/id_ed25519_juggernaut
host_key_checking = False
retry_files_enabled = False
roles_path = roles
callbacks_enabled = ansible.builtin.default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
