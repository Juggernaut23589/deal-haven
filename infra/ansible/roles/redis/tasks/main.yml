---
- name: Install Redis
  apt:
    name: redis-server
    state: present

- name: Configure Redis - bind to private IP
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^bind"
    line: "bind 127.0.0.1 {{ redis_private_ip }}"
  notify: restart redis

- name: Configure Redis - maxmemory
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^#?maxmemory "
    line: "maxmemory {{ redis_maxmemory }}"
  notify: restart redis

- name: Configure Redis - maxmemory-policy
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^#?maxmemory-policy"
    line: "maxmemory-policy {{ redis_maxmemory_policy }}"
  notify: restart redis

- name: Configure Redis - disable protected mode (VCN access only)
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^protected-mode"
    line: "protected-mode no"
  notify: restart redis

- name: Enable and start Redis
  service:
    name: redis-server
    state: started
    enabled: yes

- name: Allow Redis port through UFW from VCN only
  ufw:
    rule: allow
    from_ip: 10.0.1.0/24
    port: "{{ redis_port }}"
    proto: tcp
