---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Install Certbot
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Remove legacy deal-haven Nginx config (sites-available)
  file:
    path: /etc/nginx/sites-available/deal-haven.conf
    state: absent

- name: Remove legacy deal-haven Nginx config (sites-enabled)
  file:
    path: /etc/nginx/sites-enabled/deal-haven.conf
    state: absent

- name: Obtain Let's Encrypt certificate
  command: >
    certbot certonly --nginx
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    -d {{ domain_name }}
    -d www.{{ domain_name }}
  args:
    creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  when: enable_ssl

- name: Configure Ashimarket Nginx site
  template:
    src: deal-haven.conf.j2
    dest: /etc/nginx/sites-available/ashimarket.conf
  notify: reload nginx

- name: Enable Ashimarket site
  file:
    src: /etc/nginx/sites-available/ashimarket.conf
    dest: /etc/nginx/sites-enabled/ashimarket.conf
    state: link
  notify: reload nginx

- name: Allow HTTP through UFW
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through UFW
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Test Nginx config
  command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Reload nginx to apply latest config
  service:
    name: nginx
    state: reloaded

- name: Set up Certbot auto-renewal cron
  cron:
    name: certbot-renew
    job: "certbot renew --quiet --nginx"
    minute: "0"
    hour: "3"
    weekday: "1"
  when: enable_ssl
