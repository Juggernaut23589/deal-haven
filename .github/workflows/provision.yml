name: Provision Servers (Ansible)

on:
  push:
    branches: [dev]
    paths:
      - 'infra/ansible/**'
      - '.github/workflows/provision.yml'
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.APP_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.DB_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run Ansible playbook
        run: >
          ansible-playbook playbooks/site.yml
          --extra-vars "db_password=${{ secrets.DB_PASSWORD }}"
          --extra-vars "jwt_secret=${{ secrets.JWT_SECRET }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_PRIVATE_KEY_FILE: "~/.ssh/id_ed25519"
