name: Deploy Application

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  APP_SERVER: ${{ secrets.APP_SERVER_IP }}
  DB_SERVER: ${{ secrets.DB_SERVER_IP }}
  DEPLOY_USER: deploy
  APP_DIR: /home/deploy/ashimarket

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint backend
        run: npm run lint --if-present
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Package frontend build artifact
        run: |
          tar -czf frontend-build.tar.gz \
            -C frontend \
            .next \
            package.json \
            package-lock.json \
            next.config.js

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          retention-days: 1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.APP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Migrate app directory name if needed
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            if [ -d "/home/deploy/deal-haven" ] && [ ! -d "/home/deploy/ashimarket" ]; then
              mv /home/deploy/deal-haven /home/deploy/ashimarket
              echo "Renamed deal-haven -> ashimarket"
            fi
          ENDSSH

      - name: Pull latest code on server
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            set -e
            cd ${{ env.APP_DIR }}
            git fetch --prune --force origin dev
            git reset --hard origin/dev
            # Sync root .env (written by Ansible) into backend so Prisma and the app can read it
            cp /home/deploy/ashimarket/.env /home/deploy/ashimarket/backend/.env
          ENDSSH

      - name: Remove legacy PM2 processes
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            pm2 delete deal-haven-api 2>/dev/null || true
            pm2 delete deal-haven-web 2>/dev/null || true
            pm2 save
          ENDSSH

      - name: Deploy backend
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            set -e
            cd ${{ env.APP_DIR }}/backend
            npm ci --omit=dev

            # Baseline existing DB if needed, then run migrations
            npx prisma migrate resolve --applied 0_init 2>/dev/null || true
            npx prisma migrate deploy

            # Restart backend via PM2
            pm2 restart ashimarket-api || pm2 start npm --name ashimarket-api -- start
            pm2 save
          ENDSSH

      - name: Ship frontend build to server
        run: |
          scp frontend-build.tar.gz ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }}:/tmp/frontend-build.tar.gz

      - name: Deploy frontend
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            set -e
            cd ${{ env.APP_DIR }}/frontend

            # Wipe old build to ensure no stale files are served
            rm -rf .next

            # Unpack the pre-built artifact from CI
            tar -xzf /tmp/frontend-build.tar.gz -C .
            rm /tmp/frontend-build.tar.gz

            # Install production deps only (no build needed)
            npm ci --omit=dev

            # Restart frontend via PM2
            pm2 restart ashimarket-web || pm2 start npm --name ashimarket-web -- start
            pm2 save
          ENDSSH
