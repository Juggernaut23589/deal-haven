name: Deploy Application

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  APP_SERVER: ${{ secrets.APP_SERVER_IP }}
  DB_SERVER: ${{ secrets.DB_SERVER_IP }}
  DEPLOY_USER: deploy
  APP_DIR: /home/deploy/ashimarket

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint backend
        run: npm run lint --if-present
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.APP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull latest code on server
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            set -e
            cd ${{ env.APP_DIR }}
            git fetch --prune --force origin dev
            git reset --hard origin/dev
          ENDSSH

      - name: Deploy backend
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            set -e
            cd ${{ env.APP_DIR }}/backend
            npm ci --production

            # Baseline existing DB if needed, then run migrations
            npx prisma migrate resolve --applied 0_init 2>/dev/null || true
            npx prisma migrate deploy

            # Restart backend via PM2
            pm2 restart ashimarket-api || pm2 start npm --name ashimarket-api -- start
            pm2 save
          ENDSSH

      - name: Deploy frontend
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.APP_SERVER }} << 'ENDSSH'
            set -e
            cd ${{ env.APP_DIR }}/frontend
            npm ci
            npm run build

            # Restart frontend via PM2
            pm2 restart ashimarket-web || pm2 start npm --name ashimarket-web -- start
            pm2 save
          ENDSSH
